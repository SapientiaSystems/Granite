apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: granite-services-from-gateway
  namespace: granite
  labels:
    system: granite
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - granite-frontendcontroller-userhost
          - granite-frontendcontroller-adminhost
          - granite-user-commandhost
          - granite-user-queryhost
          - granite-session-commandhost
          - granite-session-queryhost
          - granite-outbox-servicehost
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: granite-gateway-servicehost
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: granite-session-commandhost-jwks
  namespace: granite
  labels:
    system: granite
spec:
  podSelector:
    matchLabels:
      app: granite-session-commandhost
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - granite-frontendcontroller-userhost
                  - granite-frontendcontroller-adminhost
                  - granite-user-commandhost
                  - granite-user-queryhost
                  - granite-session-queryhost
      ports:
        - protocol: TCP
          port: 8088
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: granite-gateway-ingress
  namespace: granite
  labels:
    system: granite
spec:
  podSelector:
    matchLabels:
      app: granite-gateway-servicehost
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - granite-frontendcontroller-userhost
                  - granite-frontendcontroller-adminhost
                  - granite-session-commandhost
                  - granite-web-apphost
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: granite-web-apphost-ingress
  namespace: granite
  labels:
    system: granite
spec:
  podSelector:
    matchLabels:
      app: granite-web-apphost
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
