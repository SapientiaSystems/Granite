apiVersion: apps/v1
kind: Deployment
metadata:
  name: granite-web-apphost
  namespace: granite
  labels:
    app: granite-web-apphost
    system: granite
    microservice: web
    role: apphost
spec:
  selector:
    matchLabels:
      app: granite-web-apphost
  template:
    metadata:
      labels:
        app: granite-web-apphost
        system: granite
        microservice: web
        role: apphost
    spec:
      imagePullSecrets:
        - name: ghcr-registry
      containers:
        - name: apphost
          image: ghcr.io/johnliebenau/granite/granite-web-apphost:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 443
          env:
            - name: API_BASE_URL
              value: ""
            - name: GATEWAY_URL
              value: https://granite-gateway-servicehost:443
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: granite-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            periodSeconds: 15
