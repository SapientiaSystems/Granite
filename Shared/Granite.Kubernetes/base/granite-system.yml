---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: granite-ingress
  namespace: granite
  labels:
    system: granite
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "false"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - granite.example
      secretName: granite-tls
  rules:
    - host: granite.example
      http:
        paths:
          - path: /frontendcontroller-user-service
            pathType: Prefix
            backend:
              service:
                name: granite-gateway-servicehost
                port:
                  number: 443
          - path: /frontendcontroller-admin-service
            pathType: Prefix
            backend:
              service:
                name: granite-gateway-servicehost
                port:
                  number: 443
          - path: /user-command-service
            pathType: Prefix
            backend:
              service:
                name: granite-gateway-servicehost
                port:
                  number: 443
          - path: /user-query-service
            pathType: Prefix
            backend:
              service:
                name: granite-gateway-servicehost
                port:
                  number: 443
          - path: /session-command-service
            pathType: Prefix
            backend:
              service:
                name: granite-gateway-servicehost
                port:
                  number: 443
          - path: /session-query-service
            pathType: Prefix
            backend:
              service:
                name: granite-gateway-servicehost
                port:
                  number: 443
          - path: /outbox-service
            pathType: Prefix
            backend:
              service:
                name: granite-gateway-servicehost
                port:
                  number: 443
          - path: /gateway-service
            pathType: Prefix
            backend:
              service:
                name: granite-gateway-servicehost
                port:
                  number: 443
          - path: /
            pathType: Prefix
            backend:
              service:
                name: granite-web-apphost
                port:
                  number: 443
