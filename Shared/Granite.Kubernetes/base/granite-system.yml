apiVersion: v1
kind: Namespace
metadata:
  name: granite
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: granite-frontendcontroller-userhost
  namespace: granite
  labels:
    app: granite-frontendcontroller-userhost
    system: granite
    microservice: frontendcontroller
    role: business-presenters
spec:
  selector:
    matchLabels:
      app: granite-frontendcontroller-userhost
  template:
    metadata:
      labels:
        app: granite-frontendcontroller-userhost
        system: granite
        microservice: frontendcontroller
        role: business-presenters
    spec:
      imagePullSecrets:
        - name: ghcr-registry
      containers:
        - name: userhost
          image: ghcr.io/johnliebenau/granite/granite-frontendcontroller-userhost:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: granite-environment
            - secretRef:
                name: granite-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /frontendcontroller-user-service/health/startup
              port: 8081
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /frontendcontroller-user-service/health/readiness
              port: 8081
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /frontendcontroller-user-service/health/liveness
              port: 8081
              scheme: HTTPS
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: granite-frontendcontroller-userhost
  namespace: granite
  labels:
    app: granite-frontendcontroller-userhost
spec:
  type: ClusterIP
  selector:
    app: granite-frontendcontroller-userhost
  ports:
    - port: 443
      targetPort: 8081
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: granite-frontendcontroller-userhost
  namespace: granite
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: granite-frontendcontroller-userhost
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
