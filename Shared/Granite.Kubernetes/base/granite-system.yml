  name: granite-session-commandhost
  namespace: granite
  labels:
    app: granite-session-commandhost
    system: granite
    microservice: session
    role: command
spec:
  selector:
    matchLabels:
      app: granite-session-commandhost
  template:
    metadata:
      labels:
        app: granite-session-commandhost
        system: granite
        microservice: session
        role: command
    spec:
      imagePullSecrets:
        - name: ghcr-registry
      containers:
        - name: commandhost
          image: ghcr.io/johnliebenau/granite/granite-session-commandhost:latest
          imagePullPolicy: Always
          env:
            - name: GRANITE_SESSION_JWT_PRIVATE_KEY_LOCATION
              value: file:/mnt/secrets/jwt-private-key.pem
            - name: GRANITE_SESSION_JWT_PUBLIC_KEY_LOCATION
              value: file:/mnt/secrets/jwt-public-key.pem
          volumeMounts:
            - name: session-jwt
              mountPath: /mnt/secrets
              readOnly: true
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: granite-environment
            - secretRef:
                name: granite-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /session-command-service/health/startup
              port: 8088
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /session-command-service/health/readiness
              port: 8088
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /session-command-service/health/liveness
              port: 8088
              scheme: HTTPS
            periodSeconds: 15
      volumes:
        - name: session-jwt
          secret:
            secretName: granite-session-jwt
