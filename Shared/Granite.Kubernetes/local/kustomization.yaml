apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: granite-local
resources:
  - ../base
  - granite-local.yml
configMapGenerator:
  - name: granite-environment
    literals:
      - DEPLOY_ENV=local
      - IMAGE_TAG=unset
replacements:
  - source:
      kind: ConfigMap
      name: granite-environment
      fieldPath: data.IMAGE_TAG
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: ":"
          index: 1
patches:
  - target:
      kind: Ingress
      name: granite-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: granite.localhost
      - op: replace
        path: /spec/rules/1/host
        value: client.granite.localhost
      - op: replace
        path: /spec/tls/0/hosts/0
        value: granite.localhost
      - op: replace
        path: /spec/tls/0/hosts/1
        value: client.granite.localhost
      - op: add
        path: /metadata/annotations/cert-manager.io~1issuer
        value: granite-ca-issuer
