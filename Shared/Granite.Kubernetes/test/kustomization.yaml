apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - granite-test.yml
configMapGenerator:
  - name: granite-environment
    namespace: granite
    literals:
      - DEPLOY_ENV=test
      - IMAGE_TAG=1.0.0-test
replacements:
  - source:
      kind: ConfigMap
      name: granite-environment
      fieldPath: data.IMAGE_TAG
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: ":"
          index: 1
patches:
  - target:
      kind: Ingress
      name: granite-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: granite-test.__domain__
      - op: replace
        path: /spec/rules/1/host
        value: client.granite-test.__domain__
      - op: replace
        path: /spec/tls/0/hosts/0
        value: granite-test.__domain__
      - op: replace
        path: /spec/tls/0/hosts/1
        value: client.granite-test.__domain__
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: granite-letsencrypt-staging
