apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: granite-letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: __acme_email__
    privateKeySecretRef:
      name: granite-letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
