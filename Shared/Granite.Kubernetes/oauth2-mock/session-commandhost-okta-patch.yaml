spec:
  template:
    spec:
      containers:
        - name: commandhost
          env:
            - name: GRANITE_SESSION_LOGIN_OKTA_ENABLED
              value: "true"
            - name: GRANITE_SESSION_OKTA_ISSUER
              value: http://oauth2-mock.localhost:8090/default
            - name: GRANITE_SESSION_OKTA_CLIENT_ID
              value: granite-session-local
            - name: GRANITE_SESSION_OKTA_REDIRECT_URI
              value: https://granite.localhost/login/callback
            - name: GRANITE_SESSION_OKTA_REDIRECTURIS_CLIENT
              value: https://client.granite.localhost/login/callback
            - name: GRANITE_SESSION_OKTA_ROLE_ASSIGNMENT
              value: ON_CREATE
            - name: GRANITE_SESSION_OKTA_KEYSTORE_LOCATION
              value: file:/mnt/okta/okta-client.p12
            - name: GRANITE_SESSION_OKTA_KEYSTORE_TYPE
              value: PKCS12
            - name: GRANITE_SESSION_OKTA_KEYSTORE_ALIAS
              value: okta-client
            - name: GRANITE_SESSION_OKTA_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: granite-session-okta
                  key: keystore-password
          volumeMounts:
            - name: session-okta
              mountPath: /mnt/okta
              readOnly: true
      volumes:
        - name: session-okta
          secret:
            secretName: granite-session-okta
