apiVersion: v1
kind: ConfigMap
metadata:
  name: granite-oauth2-mock-config
  labels:
    app: granite-oauth2-mock
    system: granite
data:
  config.json: |
    {
      "interactiveLogin": true,
      "httpServer": "NettyWrapper"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: granite-oauth2-mock
  labels:
    app: granite-oauth2-mock
    system: granite
    role: test-support
spec:
  replicas: 1
  selector:
    matchLabels:
      app: granite-oauth2-mock
  template:
    metadata:
      labels:
        app: granite-oauth2-mock
        system: granite
        role: test-support
    spec:
      containers:
        - name: oauth2-mock
          image: ghcr.io/navikt/mock-oauth2-server:6.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: JSON_CONFIG_PATH
              value: /config/config.json
            - name: LOG_LEVEL
              value: INFO
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: granite-oauth2-mock-config
---
apiVersion: v1
kind: Service
metadata:
  name: granite-oauth2-mock
  labels:
    app: granite-oauth2-mock
spec:
  selector:
    app: granite-oauth2-mock
  ports:
    - port: 8090
      targetPort: 8080
