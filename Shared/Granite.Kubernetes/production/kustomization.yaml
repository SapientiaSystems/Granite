apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: granite-prod
resources:
  - ../base
  - granite-production.yml
configMapGenerator:
  - name: granite-environment
    literals:
      - DEPLOY_ENV=production
      - IMAGE_TAG=unset
replacements:
  - source:
      kind: ConfigMap
      name: granite-environment
      fieldPath: data.IMAGE_TAG
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: ":"
          index: 1
patches:
  - target:
      kind: Ingress
      name: granite-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: granite.__domain__
      - op: replace
        path: /spec/rules/1/host
        value: client.granite.__domain__
      - op: replace
        path: /spec/tls/0/hosts/0
        value: granite.__domain__
      - op: replace
        path: /spec/tls/0/hosts/1
        value: client.granite.__domain__
      - op: add
        path: /metadata/annotations/cert-manager.io~1issuer
        value: granite-letsencrypt-prod
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /user-command-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /user-query-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /session-command-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /session-query-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /feedback-command-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /feedback-query-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /survey-command-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /survey-query-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /agent-command-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /agent-query-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /content-command-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /content-query-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /client-command-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /client-query-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: test
        path: /spec/rules/0/http/paths/2/path
        value: /outbox-service
      - op: remove
        path: /spec/rules/0/http/paths/2
      - op: add
        path: /spec/rules/0/http/paths/2
        value:
          path: /session-command-service/oauth2/token
          pathType: Exact
          backend:
            service:
              name: granite-gateway-servicehost
              port:
                number: 443
      - op: add
        path: /spec/rules/0/http/paths/2
        value:
          path: /client-command-service/rotate-own-client-secret
          pathType: Exact
          backend:
            service:
              name: granite-gateway-servicehost
              port:
                number: 443
