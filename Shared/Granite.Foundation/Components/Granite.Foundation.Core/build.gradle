plugins {
    id 'java-library'
}

sourceSets {
    main.java.srcDirs = ['src/main/java']
    main.resources.srcDirs = ['src/main/resources']
    test.java.srcDirs = ['src/unused']
    test.resources.srcDirs = ['src/unused']
}

apply plugin: 'maven-publish'

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
}

publishing {
    publications {
        GraniteFoundationCore(MavenPublication) {
            artifactId = 'granite-foundation-core'
            from components.java

            repositories {
                maven {
                    name "GitHubPackages"
                    url "https://maven.pkg.github.com/StrataFrameworkSet/repository"
                    credentials {
                        username = "$System.env.REPOSITORY_USER"
                        password = "$System.env.REPOSITORY_PASSWORD"
                    }
                }
            }
        }
    }
}

dependencies {
    api "strata.foundation:strata-foundation-core:$strata_foundation_version"
    api "org.springframework.security:spring-security-oauth2-resource-server:$spring_security_version"
    api "org.springframework.security:spring-security-oauth2-jose:$spring_security_version"
    api "org.springframework.security:spring-security-config:$spring_security_version"
}
