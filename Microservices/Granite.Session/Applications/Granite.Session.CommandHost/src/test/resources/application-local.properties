jakarta.persistence.persistence-unit=session-server-domain
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:session-smoke;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.mapping-resources=Session.orm.xml,OutboxEvent.orm.xml
hibernate.dialect=org.hibernate.dialect.H2Dialect
granite.session.jwt.private-key-location=classpath:jwt-test-private-key.pem
granite.session.jwt.public-key-location=classpath:jwt-test-public-key.pem
granite.session.jwt.audience=granite-services
granite.session.jwt.issuer=granite-session
granite.session.jwt.ttl=PT1H
granite.user-query-service.host=https://localhost:8084
granite.user-command-service.host=https://localhost:8083
granite.client-command-service.host=https://localhost:8097
granite.session.login.okta.enabled=false
