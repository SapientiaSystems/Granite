server.port=8088
server.forward-headers-strategy=framework
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
strata.health.base-path=/session-command-service/health
springdoc.swagger-ui.path=/session-command-service/swagger-ui
springdoc.api-docs.path=/session-command-service/v3/api-docs
jakarta.persistence.persistence-unit=session-server-domain
