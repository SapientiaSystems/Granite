spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://granite-session-postgres:5432/granite_session
spring.jpa.show-sql=false
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.ssl.bundle.jks.granite-services.keystore.location=${GRANITE_KEYSTORE_LOCATION}
spring.ssl.bundle.jks.granite-services.keystore.password=${GRANITE_KEYSTORE_PASSWORD}
spring.ssl.bundle.jks.granite-services.keystore.type=PKCS12
spring.ssl.bundle.jks.granite-services.truststore.location=${GRANITE_TRUSTSTORE_LOCATION}
spring.ssl.bundle.jks.granite-services.truststore.password=${GRANITE_TRUSTSTORE_PASSWORD}
spring.ssl.bundle.jks.granite-services.truststore.type=PKCS12
spring.ssl.bundle.jks.granite-services.key.alias=granite-services
server.ssl.bundle=granite-services
granite.session.jwt.private-key-location=file:/mnt/secrets/jwt-private-key.pem
granite.session.jwt.public-key-location=file:/mnt/secrets/jwt-public-key.pem
granite.session.jwt.audience=granite-services
granite.session.jwt.issuer=granite-session
granite.session.jwt.ttl=PT15M
granite.session.oauth2.providers.google.issuer-uri=https://accounts.google.com
granite.session.oauth2.providers.google.audience=${OAUTH2_GOOGLE_AUDIENCE}
granite.session.oauth2.providers.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
granite.user-command-service.host=https://granite-user-commandhost:443
granite.user-query-service.host=https://granite-user-queryhost:443
granite.session.user-client.ssl-bundle=granite-services
