spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://granite-session-postgres:5432/granite_session
spring.jpa.show-sql=false
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.ssl.bundle.jks.granite-services.keystore.location=${GRANITE_KEYSTORE_LOCATION}
spring.ssl.bundle.jks.granite-services.keystore.password=${GRANITE_KEYSTORE_PASSWORD}
spring.ssl.bundle.jks.granite-services.keystore.type=PKCS12
spring.ssl.bundle.jks.granite-services.truststore.location=${GRANITE_TRUSTSTORE_LOCATION}
spring.ssl.bundle.jks.granite-services.truststore.password=${GRANITE_TRUSTSTORE_PASSWORD}
spring.ssl.bundle.jks.granite-services.truststore.type=PKCS12
spring.ssl.bundle.jks.granite-services.key.alias=granite-services
server.ssl.bundle=granite-services
granite.session.jwt.private-key-location=file:/mnt/secrets/jwt-private-key.pem
granite.session.jwt.public-key-location=file:/mnt/secrets/jwt-public-key.pem
granite.session.jwt.audience=granite-services
granite.session.jwt.issuer=granite-session
granite.session.jwt.ttl=PT15M
granite.session.login.okta.enabled=${OKTA_ENABLED:false}
granite.session.okta.issuer=${OKTA_ISSUER:}
granite.session.okta.client-id=${OKTA_CLIENT_ID:}
granite.session.okta.redirect-uri=${OKTA_REDIRECT_URI:}
granite.session.okta.post-logout-redirect-uri=${OKTA_POST_LOGOUT_REDIRECT_URI:}
granite.session.okta.role-assignment=${OKTA_ROLE_ASSIGNMENT:ON_CREATE}
granite.session.okta.unmapped-groups=${OKTA_UNMAPPED_GROUPS:DEFAULT_ROLE}
granite.session.okta.keystore.location=${OKTA_KEYSTORE_LOCATION:file:/mnt/secrets/okta-client.p12}
granite.session.okta.keystore.type=PKCS12
granite.session.okta.keystore.alias=${OKTA_KEYSTORE_ALIAS:okta-client}
granite.session.okta.keystore.password=${OKTA_KEYSTORE_PASSWORD:}
granite.user-command-service.host=https://granite-gateway-servicehost:443
granite.user-query-service.host=https://granite-gateway-servicehost:443
granite.session.user-client.ssl-bundle=granite-services
granite.session.service-clients.granite-frontendcontroller.secret-sha256=${FEC_SERVICE_CLIENT_SECRET_SHA256:}
granite.session.service-clients.granite-frontendcontroller.lifetime=PT10M
