spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://granite-db-test:5432/granite-db-test
spring.jpa.show-sql=false
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.ssl.bundle.jks.granite-services.keystore.location=classpath:granite-services.p12
spring.ssl.bundle.jks.granite-services.keystore.password=granite-test
spring.ssl.bundle.jks.granite-services.keystore.type=PKCS12
spring.ssl.bundle.jks.granite-services.truststore.location=classpath:granite-truststore.p12
spring.ssl.bundle.jks.granite-services.truststore.password=granite-test
spring.ssl.bundle.jks.granite-services.truststore.type=PKCS12
spring.ssl.bundle.jks.granite-services.key.alias=granite-services
server.ssl.bundle=granite-services
granite.session.jwt.private-key-location=file:/mnt/secrets/jwt-private-key.pem
granite.session.jwt.public-key-location=file:/mnt/secrets/jwt-public-key.pem
granite.session.jwt.audience=granite-services
granite.session.jwt.issuer=granite-session
granite.session.jwt.ttl=PT15M
granite.session.login.okta.enabled=${OKTA_ENABLED_TEST:false}
granite.session.okta.issuer=${OKTA_ISSUER_TEST:}
granite.session.okta.client-id=${OKTA_CLIENT_ID_TEST:}
granite.session.okta.redirect-uri=${OKTA_REDIRECT_URI_TEST:}
granite.session.okta.role-assignment=${OKTA_ROLE_ASSIGNMENT_TEST:ON_CREATE}
granite.session.okta.unmapped-groups=${OKTA_UNMAPPED_GROUPS_TEST:DEFAULT_ROLE}
granite.session.okta.keystore.location=file:/mnt/secrets/okta-client.p12
granite.session.okta.keystore.type=PKCS12
granite.session.okta.keystore.alias=okta-client
granite.session.okta.keystore.password=${OKTA_KEYSTORE_PASSWORD_TEST:}
granite.user-command-service.host=https://granite-gateway-servicehost:443
granite.user-query-service.host=https://granite-gateway-servicehost:443
granite.client-command-service.host=https://granite-gateway-servicehost:443
granite.session.user-client.ssl-bundle=granite-services
granite.session.service-clients.granite-frontendcontroller.secret-sha256=${FEC_SERVICE_CLIENT_SECRET_SHA256:}
granite.session.service-clients.granite-frontendcontroller.lifetime=PT10M
granite.session.service-clients.granite-agent.secret-sha256=${AGENT_SERVICE_CLIENT_SECRET_SHA256:}
granite.session.service-clients.granite-agent.lifetime=PT10M
granite.session.service-clients.granite-agent.delegation=true
