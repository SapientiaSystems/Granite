spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=test-user
spring.datasource.password=test-password
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/granite-db
spring.jpa.show-sql=true
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.ssl.bundle.jks.granite-services.keystore.location=classpath:granite-services.p12
spring.ssl.bundle.jks.granite-services.keystore.password=granite-test
spring.ssl.bundle.jks.granite-services.keystore.type=PKCS12
spring.ssl.bundle.jks.granite-services.truststore.location=classpath:granite-truststore.p12
spring.ssl.bundle.jks.granite-services.truststore.password=granite-test
spring.ssl.bundle.jks.granite-services.truststore.type=PKCS12
spring.ssl.bundle.jks.granite-services.key.alias=granite-services
server.ssl.bundle=granite-services
logging.level.org.springframework.security=TRACE
granite.session.jwt.private-key-location=file:${user.home}/.granite/dev-keys/jwt-test-private-key.pem
granite.session.jwt.public-key-location=file:${user.home}/.granite/dev-keys/jwt-test-public-key.pem
granite.session.jwt.audience=granite-services
granite.session.jwt.issuer=granite-session
granite.session.jwt.ttl=PT15M
granite.session.oauth2.providers.google.issuer-uri=https://accounts.google.com
granite.session.oauth2.providers.google.audience=<dev-client-id>
granite.session.oauth2.providers.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
granite.user-command-service.host=https://granite-user-commandhost:443
granite.user-query-service.host=https://granite-user-queryhost:443
granite.session.user-client.ssl-bundle=granite-services
granite.session.login.required-authorities=ROLE_ADMIN,ROLE_AUDITOR
