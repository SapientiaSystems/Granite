spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://granite-session-postgres:5432/granite_session
spring.jpa.show-sql=false
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.ssl.bundle.jks.granite-services.keystore.location=classpath:granite-services.p12
spring.ssl.bundle.jks.granite-services.keystore.password=granite-test
spring.ssl.bundle.jks.granite-services.keystore.type=PKCS12
spring.ssl.bundle.jks.granite-services.truststore.location=classpath:granite-truststore.p12
spring.ssl.bundle.jks.granite-services.truststore.password=granite-test
spring.ssl.bundle.jks.granite-services.truststore.type=PKCS12
spring.ssl.bundle.jks.granite-services.key.alias=granite-services
server.ssl.bundle=granite-services
logging.level.org.springframework.security=TRACE
granite.session.jwt.private-key-location=file:/mnt/secrets/jwt-private-key.pem
granite.session.jwt.public-key-location=file:/mnt/secrets/jwt-public-key.pem
granite.session.jwt.audience=granite-services
granite.session.jwt.issuer=granite-session
granite.session.jwt.ttl=PT15M
granite.session.login.okta.enabled=${OKTA_ENABLED_DEVELOPMENT:false}
granite.session.okta.issuer=${OKTA_ISSUER_DEVELOPMENT:}
granite.session.okta.client-id=${OKTA_CLIENT_ID_DEVELOPMENT:}
granite.session.okta.redirect-uri=${OKTA_REDIRECT_URI_DEVELOPMENT:}
granite.session.okta.post-logout-redirect-uri=${OKTA_POST_LOGOUT_REDIRECT_URI_DEVELOPMENT:}
granite.session.okta.authorities-source=${OKTA_AUTHORITIES_SOURCE_DEVELOPMENT:USER}
granite.session.okta.keystore.location=file:/mnt/secrets/okta-client.p12
granite.session.okta.keystore.type=PKCS12
granite.session.okta.keystore.alias=okta-client
granite.session.okta.keystore.password=${OKTA_KEYSTORE_PASSWORD_DEVELOPMENT:}
granite.user-command-service.host=https://granite-user-commandhost:443
granite.user-query-service.host=https://granite-user-queryhost:443
granite.session.user-client.ssl-bundle=granite-services
granite.session.login.required-authorities=ROLE_ADMIN,ROLE_AUDITOR
