jakarta.persistence.persistence-unit=session-server-domain
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:session-smoke;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.mapping-resources=Session.orm.xml,OutboxEvent.orm.xml
hibernate.dialect=org.hibernate.dialect.H2Dialect
granite.security.jwt.jwk-set-uri=http://localhost:8088/.well-known/jwks.json
