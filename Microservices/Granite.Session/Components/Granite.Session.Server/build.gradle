plugins {
    id 'java-library'
}

sourceSets {
    main.java.srcDirs = ['src/main/java','.build/generated-java']
    main.resources.srcDirs = ['src/main/resources','src/main/schema']
    test.java.srcDirs = ['src/unused']
    test.resources.srcDirs = ['src/unused']
}


apply plugin: 'maven-publish'

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
}

publishing {
    publications {
        GraniteSessionServer(MavenPublication) {
            artifactId = 'granite-session-server'
            from components.java

            repositories {
                maven {
                    name "GitHubPackages"
                    url "https://maven.pkg.github.com/StrataFrameworkSet/repository"
                    credentials {
                        username = "$System.env.REPOSITORY_USER"
                        password = "$System.env.REPOSITORY_PASSWORD"
                    }
                }
            }
        }
    }
}

dependencies {
    api project(":Components:Granite.Session.Service")
    api "granite.foundation:granite-foundation-core:$system_version"
    api "granite.user:granite-user-client:$system_version"
    api "granite.client:granite-client-client:$system_version"
    api "strata.server:strata-server-spring:$strata_server_version"
    api "strata.outbox:strata-outbox-core:$strata_outbox_version"
    api "org.springframework.boot:spring-boot-starter-security:$springboot_version"
    api "org.springframework.boot:spring-boot-starter-validation:$springboot_version"
    api "org.springframework.security:spring-security-core:$spring_security_version"
    implementation "org.springframework.security:spring-security-oauth2-jose:$spring_security_version"
    api "org.postgresql:postgresql:$postgresql_version"
    api "com.h2database:h2:$h2_version"
    api "org.modelmapper:modelmapper:$modelmapper_version"
}
