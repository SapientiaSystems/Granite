jakarta.persistence.persistence-unit=session-server-domain
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.url=jdbc:h2:mem:session-test;DB_CLOSE_DELAY=-1
spring.jpa.show-sql=true
hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.mapping-resources=Session.orm.xml,OutboxEvent.orm.xml
spring.guice.dedup=true

test.wiremock.port=18089
granite.session.oauth2.providers.test.issuer-uri=https://test-idp.example.com
granite.session.oauth2.providers.test.audience=granite-test-client
granite.session.oauth2.providers.test.jwks-uri=http://localhost:${test.wiremock.port}/.well-known/jwks.json
