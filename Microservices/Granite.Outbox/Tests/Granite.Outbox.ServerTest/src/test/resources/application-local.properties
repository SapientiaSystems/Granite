# Kafka connection properties
kafka.bootstrap.servers=localhost:9092
kafka.security.protocol=PLAINTEXT
kafka.client.id=granite.outbox.test

# Confluent Cloud / Schema Registry credentials.
# KafkaConfigurationProvider requires these keys to be present. Replace the
# placeholder values below with real credentials (ideally ENC(...) encrypted)
# for your environment. For local-only PLAINTEXT testing these are unused but
# must be defined, otherwise the provider throws IllegalArgumentException on
# construction.
kafka.api.key=replace-with-api-key
kafka.api.secret=replace-with-api-secret
kafka.schema.registry.api.key=replace-with-schema-registry-api-key
kafka.schema.registry.api.secret=replace-with-schema-registry-api-secret

# Schema Registry configuration
kafka.schema.registry.url=http://localhost:8081

# Producer specific properties
kafka.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
kafka.retries=5
kafka.acks=all

# Consumer specific properties
kafka.group.id=granite.outbox.test
kafka.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
kafka.auto.offset.reset=earliest
kafka.specific.avro.reader=true
