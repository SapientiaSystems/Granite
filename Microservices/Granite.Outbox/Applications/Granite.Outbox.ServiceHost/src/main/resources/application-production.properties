spring.ssl.bundle.jks.granite-services.keystore.location=${GRANITE_KEYSTORE_LOCATION}
spring.ssl.bundle.jks.granite-services.keystore.password=${GRANITE_KEYSTORE_PASSWORD}
spring.ssl.bundle.jks.granite-services.keystore.type=PKCS12
spring.ssl.bundle.jks.granite-services.truststore.location=${GRANITE_TRUSTSTORE_LOCATION}
spring.ssl.bundle.jks.granite-services.truststore.password=${GRANITE_TRUSTSTORE_PASSWORD}
spring.ssl.bundle.jks.granite-services.truststore.type=PKCS12
spring.ssl.bundle.jks.granite-services.key.alias=granite-services
server.ssl.bundle=granite-services
granite.security.jwt.jwk-set-uri=https://granite-session-commandhost:443/.well-known/jwks.json
granite.security.jwt.ssl-bundle=granite-services
granite.security.jwt.issuer=granite-session
granite.security.jwt.audience=granite-services
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://granite-db-prod:5432/granite-db-prod
spring.jpa.show-sql=false
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
kafka.client.id=granite.outbox.production
kafka.api.key=${KAFKA_API_KEY}
kafka.api.secret=${KAFKA_API_SECRET}
kafka.schema.registry.url=${KAFKA_SCHEMA_REGISTRY_URL}
kafka.schema.registry.api.key=${KAFKA_SCHEMA_REGISTRY_API_KEY}
kafka.schema.registry.api.secret=${KAFKA_SCHEMA_REGISTRY_API_SECRET}
kafka.retries=5
kafka.acks=all
