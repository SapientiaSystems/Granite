plugins {
    id 'java-library'
}

sourceSets {
    main.java.srcDirs = ['src/main/java']
    main.resources.srcDirs = ['src/main/resources','src/main/schema']
    test.java.srcDirs = ['src/unused']
    test.resources.srcDirs = ['src/unused']
}

apply plugin: 'maven-publish'

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
}

publishing {
    publications {
        GraniteOutboxServer(MavenPublication) {
            artifactId = 'granite-outbox-server'
            from components.java

            repositories {
                maven {
                    name "GitHubPackages"
                    url "https://maven.pkg.github.com/StrataFrameworkSet/repository"
                    credentials {
                        username = "$System.env.REPOSITORY_USER"
                        password = "$System.env.REPOSITORY_PASSWORD"
                    }
                }
            }
        }
    }
}

dependencies {
    api "strata.outbox:strata-outbox-server:$strata_outbox_version"
    api "strata.foundation:strata-foundation-kafka:$strata_foundation_version"
    api "granite.user:granite-user-service:$version"
    api "granite.feedback:granite-feedback-service:$version"
    api "granite.survey:granite-survey-service:$version"
    api "granite.foundation:granite-foundation-core:$system_version"
    api "org.springframework.boot:spring-boot-starter-security:$springboot_version"
}
