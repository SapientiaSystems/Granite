user-query-service.base-url=https://granite-user-queryhost:443
user-command-service.base-url=https://granite-user-commandhost:443
session-command-service.base-url=https://granite-session-commandhost:443
granite.session.login.okta.enabled=${OKTA_ENABLED:false}
session-query-service.base-url=https://granite-session-queryhost:443
spring.ssl.bundle.jks.granite-services.keystore.location=${GRANITE_KEYSTORE_LOCATION}
spring.ssl.bundle.jks.granite-services.keystore.password=${GRANITE_KEYSTORE_PASSWORD}
spring.ssl.bundle.jks.granite-services.keystore.type=PKCS12
spring.ssl.bundle.jks.granite-services.truststore.location=${GRANITE_TRUSTSTORE_LOCATION}
spring.ssl.bundle.jks.granite-services.truststore.password=${GRANITE_TRUSTSTORE_PASSWORD}
spring.ssl.bundle.jks.granite-services.truststore.type=PKCS12
spring.ssl.bundle.jks.granite-services.key.alias=granite-services
server.ssl.bundle=granite-services
granite.security.jwt.jwk-set-uri=https://granite-session-commandhost:443/.well-known/jwks.json
granite.security.jwt.ssl-bundle=granite-services
granite.frontendcontroller.service-client.id=granite-frontendcontroller
granite.frontendcontroller.service-client.secret=${FEC_SERVICE_CLIENT_SECRET:}
