server.port=8081
server.forward-headers-strategy=framework
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
strata.health.base-path=/frontendcontroller-user-service/health
springdoc.swagger-ui.path=/frontendcontroller-user-service/swagger-ui
springdoc.api-docs.path=/frontendcontroller-user-service/v3/api-docs
jakarta.persistence.persistence-unit=frontendcontroller-server-domain
spring.jpa.mapping-resources=FrontEndController.orm.xml
spring.main.allow-bean-definition-overriding=true
spring.guice.dedup=true
