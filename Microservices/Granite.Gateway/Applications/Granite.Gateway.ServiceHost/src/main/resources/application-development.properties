spring.cloud.gateway.httpclient.ssl.bundle=granite-services
spring.cloud.gateway.httpclient.ssl.trusted-x509-certificates[0]=classpath:granite-ca.crt
granite.frontendcontroller-user-service.host=https://granite-frontendcontroller-userhost:443
granite.frontendcontroller-admin-service.host=https://granite-frontendcontroller-adminhost:443
granite.user-command-service.host=https://granite-user-commandhost:443
granite.user-query-service.host=https://granite-user-queryhost:443
granite.session-command-service.host=https://granite-session-commandhost:443
granite.session-query-service.host=https://granite-session-queryhost:443
granite.feedback-command-service.host=https://granite-feedback-commandhost:443
granite.feedback-query-service.host=https://granite-feedback-queryhost:443
granite.outbox-service.host=https://granite-outbox-servicehost:443
spring.ssl.bundle.jks.granite-services.keystore.location=classpath:granite-services.p12
spring.ssl.bundle.jks.granite-services.keystore.password=granite-test
spring.ssl.bundle.jks.granite-services.keystore.type=PKCS12
spring.ssl.bundle.jks.granite-services.truststore.location=classpath:granite-truststore.p12
spring.ssl.bundle.jks.granite-services.truststore.password=granite-test
spring.ssl.bundle.jks.granite-services.truststore.type=PKCS12
spring.ssl.bundle.jks.granite-services.key.alias=granite-services
server.ssl.bundle=granite-services
logging.level.org.springframework.security=TRACE
granite.security.jwt.jwk-set-uri=https://granite-session-commandhost:443/.well-known/jwks.json
granite.gateway.authorization.role-rules.enabled=true
