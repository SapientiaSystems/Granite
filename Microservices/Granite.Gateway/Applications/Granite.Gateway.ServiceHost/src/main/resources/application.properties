server.port=8181
spring.main.web-application-type=reactive
strata.health.base-path=/gateway-service/health
springdoc.swagger-ui.path=/gateway-service/swagger-ui
springdoc.api-docs.path=/gateway-service/v3/api-docs
management.endpoints.access.default=read-only
management.endpoint.gateway.access=unrestricted
management.endpoints.web.exposure.include=*
spring.cloud.gateway.actuator.verbose.enabled=true
