spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://granite-db-dev:5432/granite-db-dev
spring.jpa.show-sql=false
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.ssl.bundle.jks.granite-services.keystore.location=classpath:granite-services.p12
spring.ssl.bundle.jks.granite-services.keystore.password=granite-test
spring.ssl.bundle.jks.granite-services.keystore.type=PKCS12
spring.ssl.bundle.jks.granite-services.truststore.location=classpath:granite-truststore.p12
spring.ssl.bundle.jks.granite-services.truststore.password=granite-test
spring.ssl.bundle.jks.granite-services.truststore.type=PKCS12
spring.ssl.bundle.jks.granite-services.key.alias=granite-services
server.ssl.bundle=granite-services
logging.level.org.springframework.security=TRACE
granite.security.jwt.jwk-set-uri=https://granite-session-commandhost:443/.well-known/jwks.json
granite.security.jwt.ssl-bundle=granite-services
session-command-service.base-url=https://granite-gateway-servicehost:443
content-query-service.base-url=https://granite-gateway-servicehost:443
granite.agent.service-client.id=granite-agent
granite.agent.service-client.secret=${AGENT_SERVICE_CLIENT_SECRET:}
granite.agent.claude.api-key=${ANTHROPIC_API_KEY:}
granite.agent.claude.model=claude-sonnet-5-5
granite.agent.claude.effort=medium
granite.agent.claude.max-tokens=8000
granite.agent.max-steps=8
