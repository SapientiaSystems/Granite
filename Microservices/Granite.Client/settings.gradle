pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            name "GitHub-StrataFrameworkSet-Packages"
            url "https://maven.pkg.github.com/StrataFrameworkSet/repository"
            credentials {
                username = "$System.env.REPOSITORY_USER"
                password = "$System.env.REPOSITORY_PASSWORD"
            }
        }
        maven {
            name "Confluent"
            url "https://packages.confluent.io/maven"
        }
        maven {
            name "Jabylon"
            url "https://www.jabylon.org/maven/"
        }
    }
}

rootProject.name = 'Granite.Client'

// Applications
include 'Applications:Granite.Client.CommandHost'
include 'Applications:Granite.Client.QueryHost'

// Components
include 'Components:Granite.Client.Service'
include 'Components:Granite.Client.Client'
include 'Components:Granite.Client.Server'

// Tests
include 'Tests:Granite.Client.ServiceTest'
include 'Tests:Granite.Client.ClientTest'
include 'Tests:Granite.Client.ServerTest'
include 'Tests:Granite.Client.TestSuite'


