plugins {
    id 'java-base'
}

def includedBuilds = gradle.includedBuilds

wrapper.jarFile = ".gradle/wrapper/gradle-wrapper.jar"

java {
    sourceCompatibility = JavaVersion.VERSION_23
    targetCompatibility = JavaVersion.VERSION_23
}

apply from: "${rootDir}/gradle/granite-versions.gradle"

ext {
    springboot_version = "3.4.1"
    spring_security_version = "6.2.1"

    postgresql_version = "42.7.3"
    h2_version = "2.1.214"
    modelmapper_version = "3.2.0"

    junit_jupiter_version = "5.13.3"
    junit_platform_version = "1.13.3"
}

group 'granite'
version "$system_version"
layout.buildDirectory.set(layout.projectDirectory.dir(".build"))

plugins.withType(JavaPlugin) {
    java {
        sourceCompatibility = JavaVersion.VERSION_23
        targetCompatibility = JavaVersion.VERSION_23
    }
}

subprojects {
    plugins.withType(JavaPlugin) {
        java {
            sourceCompatibility = JavaVersion.VERSION_23
            targetCompatibility = JavaVersion.VERSION_23
        }
    }
}

subprojects {
    group 'granite'
    version "$system_version"
    layout.buildDirectory.set(layout.projectDirectory.dir(".build"))
}

tasks.named('build') {
    includedBuilds.each { b ->
        dependsOn b.task(':build')
    }
}

tasks.named('clean') {
    includedBuilds.each { b ->
        dependsOn b.task(':clean')
    }
}

tasks.register('jib') {
    description = 'Builds images and publishes to registry'
    group = 'jib'
    includedBuilds.each { b ->
        dependsOn b.task(':jib')
    }
}

tasks.named('assemble') {
    includedBuilds.each { b ->
        dependsOn b.task(':assemble')
    }
}

tasks.named('check') {
    includedBuilds.each { b ->
        dependsOn b.task(':check')
    }
}

tasks.register('publish') {
    description = 'Publishes all publications produced by all included builds'
    group = 'publishing'
    includedBuilds.each { b ->
        dependsOn b.task(':publish')
    }
}

tasks.register('publishToMavenLocal') {
    description = 'Publishes all publications produced by all included builds to the local Maven cache'
    group = 'publishing'
    includedBuilds.each { b ->
        dependsOn b.task(':publishToMavenLocal')
    }
}

tasks.register('publishToGitHubPackages') {
    description = 'Publishes all publications produced by all included builds to the GitHubPackages repository'
    group = 'publishing'
    includedBuilds.each { b ->
        dependsOn b.task(':publishToGitHubPackages')
    }
}
